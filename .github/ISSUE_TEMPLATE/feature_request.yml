name: 改善提案
description: 新機能、改善、設計変更の提案
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 誰が、どんな場面で困るのかを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 望ましい挙動や設計案を書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別案があれば書いてください。
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: 完了条件
      description: どのテスト、ドキュメント、挙動で完了と判断するかを書いてください。
      placeholder: |
        - npm test が通る
        - README に使い方が追記される
    validations:
      required: true
